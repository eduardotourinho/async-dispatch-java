apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: async-dispatch
  description: Distributed async task processing system — polyglot implementations of the same event-driven pattern
  tags:
    - async
    - task-processing
    - event-driven
spec:
  owner: user:default/eduardo-tourinho
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: async-dispatch-db
  description: PostgreSQL database storing task records and results for the async-dispatch system. Schema managed by Flyway.
  tags:
    - postgresql
    - database
spec:
  type: database
  owner: user:default/eduardo-tourinho
  system: async-dispatch
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: async-dispatch-tasks-queue
  description: AWS SQS FIFO queue (tasks.fifo) — dispatches task messages from task-manager to task-worker.
  tags:
    - aws-sqs
    - message-queue
spec:
  type: message-queue
  owner: user:default/eduardo-tourinho
  system: async-dispatch
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: async-dispatch-task-results-queue
  description: AWS SQS FIFO queue (task-results.fifo) — delivers processed results from task-worker back to task-manager.
  tags:
    - aws-sqs
    - message-queue
spec:
  type: message-queue
  owner: user:default/eduardo-tourinho
  system: async-dispatch
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: async-dispatch-task-manager
  description: >
    REST API service for submitting async tasks and retrieving their status.
    Persists task state to PostgreSQL (Flyway migrations), dispatches work via
    SQS FIFO queues, and consumes result messages to update task records.
    Scales horizontally via HPA (CPU-based).
  annotations:
    github.com/project-slug: eduardotourinho/async-dispatch-java
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/eduardotourinho/async-dispatch-java
      title: GitHub
      icon: github
  tags:
    - java
    - spring-boot
    - aws-sqs
    - postgresql
    - kubernetes
spec:
  type: service
  owner: user:default/eduardo-tourinho
  lifecycle: experimental
  system: async-dispatch
  providesApis:
    - async-dispatch-api
  dependsOn:
    - resource:default/async-dispatch-db
    - resource:default/async-dispatch-tasks-queue
    - resource:default/async-dispatch-task-results-queue
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: async-dispatch-task-worker
  description: >
    SQS-driven worker service that consumes tasks from tasks.fifo, executes
    currency conversion and interest calculation, and publishes results to
    task-results.fifo. Scales to zero and back via KEDA (SQS queue-depth-based
    autoscaling) — no database dependency.
  annotations:
    github.com/project-slug: eduardotourinho/async-dispatch-java
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/eduardotourinho/async-dispatch-java
      title: GitHub
      icon: github
  tags:
    - java
    - spring-boot
    - aws-sqs
    - kubernetes
    - keda
spec:
  type: service
  owner: user:default/eduardo-tourinho
  lifecycle: experimental
  system: async-dispatch
  dependsOn:
    - resource:default/async-dispatch-tasks-queue
    - resource:default/async-dispatch-task-results-queue
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: async-dispatch-api
  description: Task processing API for submitting and retrieving distributed tasks (currency conversion, interest calculation).
  tags:
    - rest
spec:
  type: openapi
  lifecycle: experimental
  owner: user:default/eduardo-tourinho
  system: async-dispatch
  definition: |
    openapi: "3.0.3"
    info:
      title: Async Dispatch Task API
      description: >
        REST API for submitting async tasks (currency conversion, interest
        calculation) to SQS FIFO queues and retrieving their results from
        PostgreSQL once processing is complete.
      version: "1.0.0"
    paths:
      /api/tasks:
        post:
          summary: Submit a new async task
          description: >
            Enqueues a new task onto the tasks.fifo SQS queue for asynchronous
            processing. Returns the generated task ID immediately; poll
            GET /api/tasks/{taskId} to retrieve the result.
          operationId: enqueueTask
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/TaskRequest'
          responses:
            '201':
              description: Task accepted and enqueued successfully.
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/TaskResponse'
            '400':
              description: Invalid request body (missing or malformed fields).
            '500':
              description: Internal server error — task could not be enqueued.
      /api/tasks/{taskId}:
        get:
          summary: Get task status and result
          description: >
            Returns the current status and, when processing is complete, the
            result of a previously submitted task.
          operationId: getTask
          parameters:
            - name: taskId
              in: path
              required: true
              description: UUID of the task returned by POST /api/tasks.
              schema:
                type: string
                format: uuid
          responses:
            '200':
              description: Task found — returns status and result (if available).
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/TaskResult'
            '404':
              description: No task found with the given taskId.
            '500':
              description: Internal server error.
    components:
      schemas:
        TaskRequest:
          type: object
          required:
            - type
            - payload
          properties:
            type:
              $ref: '#/components/schemas/TaskType'
            payload:
              type: object
              description: >
                Input data for the task.
                For CONVERT_CURRENCY: amount (number), fromCurrency (string), toCurrency (string).
                For CALCULATE_INTEREST: principal (number), annualRate (number), days (integer).
              additionalProperties: true
        TaskResponse:
          type: object
          properties:
            taskId:
              type: string
              format: uuid
              description: Unique identifier assigned to the newly created task.
        TaskResult:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Unique task identifier.
            type:
              $ref: '#/components/schemas/TaskType'
            payload:
              type: object
              description: Original payload submitted with the task.
              additionalProperties: true
            status:
              $ref: '#/components/schemas/TaskStatus'
            result:
              type: string
              description: >
                Output produced by the task processor. Present only when
                status is COMPLETED.
              nullable: true
        TaskType:
          type: string
          description: Identifies the kind of computation to perform.
          enum:
            - CONVERT_CURRENCY
            - CALCULATE_INTEREST
        TaskStatus:
          type: string
          description: Lifecycle state of the task.
          enum:
            - PENDING
            - COMPLETED
            - CANCELLED
