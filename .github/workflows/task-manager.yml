name: task-manager CI/CD

# Path-filtered: only runs when task-manager or shared code changes.
# This prevents unnecessary builds when only task-worker changes.
on:
  push:
    branches: [master, main]
    paths:
      - "common/**"
      - "task-manager/**"
      - "helm/task-manager/**"
      - ".github/workflows/task-manager.yml"
  pull_request:
    paths:
      - "common/**"
      - "task-manager/**"
      - "helm/task-manager/**"
      - ".github/workflows/task-manager.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: task-manager

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Build and test task-manager
        run: ./gradlew :task-manager:test --no-daemon

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: task-manager Tests
          path: task-manager/build/test-results/**/*.xml
          reporter: java-junit

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint helm/task-manager

      - name: Template render (dev values)
        run: helm template task-manager helm/task-manager -f helm/task-manager/values-dev.yaml

      - name: Template render (prod values)
        run: helm template task-manager helm/task-manager -f helm/task-manager/values-prod.yaml

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-and-test, helm-lint]
    # Only push images from the main branch (not PRs)
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      # OIDC token for keyless AWS authentication — no long-lived secrets stored in GitHub
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f task-manager/Dockerfile \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest
