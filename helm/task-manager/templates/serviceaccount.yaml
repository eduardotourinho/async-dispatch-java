{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "task-manager.serviceAccountName" . }}
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.serviceAccount.irsaRoleArn }}
    # IRSA: binds this ServiceAccount to an IAM role via OIDC federation.
    # The pod inherits the role's permissions without hardcoded AWS credentials.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.irsaRoleArn | quote }}
    {{- end }}
{{- end }}
