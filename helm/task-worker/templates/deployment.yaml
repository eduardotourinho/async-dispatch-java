apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-worker.fullname" . }}
  labels:
    {{- include "task-worker.labels" . | nindent 4 }}
spec:
  # When KEDA is enabled it manages replicas directly via the ScaledObject.
  # Setting replicas here only applies when KEDA is disabled.
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "task-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-worker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "task-worker.serviceAccountName" . }}
      # Spread worker pods across nodes so a node failure doesn't halt all processing
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "task-worker.selectorLabels" . | nindent 14 }}
      containers:
        - name: task-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "task-worker.fullname" . }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
