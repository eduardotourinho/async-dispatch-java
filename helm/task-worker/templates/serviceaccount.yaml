{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "task-worker.serviceAccountName" . }}
  labels:
    {{- include "task-worker.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.serviceAccount.irsaRoleArn }}
    # IRSA: the pod assumes this IAM role via OIDC federation.
    # Required permissions: sqs:ReceiveMessage, sqs:DeleteMessage, sqs:SendMessage,
    # sqs:GetQueueAttributes (KEDA uses GetQueueAttributes to read queue depth).
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.irsaRoleArn | quote }}
    {{- end }}
{{- end }}
