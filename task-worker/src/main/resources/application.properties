spring.application.name=task-worker

# AWS
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
spring.cloud.aws.endpoint=${AWS_ENDPOINT_URL:}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}

# SQS
spring.cloud.aws.sqs.enabled=true
spring.cloud.aws.sqs.endpoint=${AWS_ENDPOINT_URL:}
spring.cloud.aws.sqs.tasks-queue-url=${SQS_TASKS_QUEUE_URL:http://localhost:4566/000000000000/tasks.fifo}
spring.cloud.aws.sqs.task-results-queue-url=${SQS_TASK_RESULTS_QUEUE_URL:http://localhost:4566/000000000000/task-results.fifo}
spring.cloud.aws.sqs.tasks-dlq-queue-url=${SQS_TASKS_DLQ_QUEUE_URL:http://localhost:4566/000000000000/tasks-dlq.fifo}
spring.cloud.aws.sqs.task-results-dlq-queue-url=${SQS_TASK_RESULTS_DLQ_QUEUE_URL:http://localhost:4566/000000000000/task-results-dlq.fifo}

spring.docker.compose.enabled=false

# Actuator — expose health groups for K8s liveness/readiness probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.info.java.enabled=true
management.info.build.enabled=true
