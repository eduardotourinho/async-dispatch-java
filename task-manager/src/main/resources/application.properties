spring.application.name=task-manager

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/async_dispatch}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway — manages schema; ddl-auto=update is not safe for production
spring.flyway.enabled=true

# AWS
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
spring.cloud.aws.endpoint=${AWS_ENDPOINT_URL:}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}

# SQS
spring.cloud.aws.sqs.enabled=true
spring.cloud.aws.sqs.endpoint=${AWS_ENDPOINT_URL:}
spring.cloud.aws.sqs.tasks-queue-url=${SQS_TASKS_QUEUE_URL:http://localhost:4566/000000000000/tasks.fifo}
spring.cloud.aws.sqs.task-results-queue-url=${SQS_TASK_RESULTS_QUEUE_URL:http://localhost:4566/000000000000/task-results.fifo}
spring.cloud.aws.sqs.tasks-dlq-queue-url=${SQS_TASKS_DLQ_QUEUE_URL:http://localhost:4566/000000000000/tasks-dlq.fifo}
spring.cloud.aws.sqs.task-results-dlq-queue-url=${SQS_TASK_RESULTS_DLQ_QUEUE_URL:http://localhost:4566/000000000000/task-results-dlq.fifo}

spring.docker.compose.enabled=false

# Actuator — expose health groups for K8s liveness/readiness probes
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.info.build.enabled=true

info.app.name=task-manager
info.app.description=Async task submission and status API

# Springdoc / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
